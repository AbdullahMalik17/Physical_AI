name: CI

on:
  push:
    branches: [main, 001-physical-ai-platform]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: physical-ai-textbook/package-lock.json

      - name: Install dependencies
        run: |
          cd physical-ai-textbook
          npm ci

      - name: Run linter
        run: |
          cd physical-ai-textbook
          npm run lint || echo "Linter not configured yet"

      - name: Run type check
        run: |
          cd physical-ai-textbook
          npm run typecheck

      - name: Run unit tests
        run: |
          cd physical-ai-textbook
          npm test -- --coverage || echo "Unit tests pending implementation"

      - name: Build project
        run: |
          cd physical-ai-textbook
          npm run build

      - name: Install Playwright browsers
        run: |
          cd physical-ai-textbook
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd physical-ai-textbook
          npm run build
          npm run test:e2e || echo "E2E tests require serve command"

      - name: Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: physical-ai-textbook/build/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: physical-ai-textbook/package-lock.json

      - name: Install dependencies
        run: |
          cd physical-ai-textbook
          npm ci

      - name: Build project
        run: |
          cd physical-ai-textbook
          npm run build

      - name: Run Lighthouse CI
        run: |
          cd physical-ai-textbook
          npm run test:lighthouse || echo "Lighthouse CI requires serve command"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
